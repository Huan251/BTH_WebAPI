<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin – Cửa hàng đồ chơi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="trangchu.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<body>
<header class="header banner-header">
    <div class="header-left">
        <h1>Cửa Hàng Đồ Chơi - 𝓵𝓺𝓗𝓿𝓠𝓿</h1>
    </div>

    <div class="header-right">
        <button class="header-btn" data-type="tonkho">
            <i class="fa-solid fa-warehouse"></i> Tồn kho
        </button>

        <div class="profit-menu">
    <div class="header-btn profit-btn no-click">
        <i class="fa-solid fa-chart-line"></i>
        <span>Lợi nhuận</span>
        <i class="fa-solid fa-chevron-down arrow"></i>
    </div>

    <div class="profit-submenu">
        <div class="profit-item" data-type="loi-thang">
            <i class="fa-regular fa-calendar"></i>
            Theo tháng
        </div>
        <div class="profit-item" data-type="loi-sanpham">
            <i class="fa-solid fa-box"></i>
            Theo sản phẩm
        </div>
    </div>
</div>


    </div>
</header>

<section class="functions">
    <div class="function-bar">
        <div class="function-card" data-type="sanpham">SẢN PHẨM</div>
        <div class="function-card" data-type="danhmuc">DANH MỤC</div>
        <div class="function-card" data-type="nhacungcap">NHÀ CUNG CẤP</div>
        <div class="function-card" data-type="khachhang">KHÁCH HÀNG</div>
        <div class="function-card" data-type="phieunhap">PHIẾU NHẬP</div>
        <div class="function-card" data-type="hoadon">HÓA ĐƠN</div>
        <div class="function-card" data-type="cthd">CHI TIẾT ĐƠN</div>
        <div class="function-card" data-type="ctpn">CHI TIẾT PHIẾU NHẬP</div>

    </div>
</section>

<!-- NỘI DUNG -->
<section class="content">
    <div id="table-area" class="content-box">
        <p>Click vào chức năng để xem dữ liệu</p>
    </div>
</section>

<script src="trangchu.js"></script>


</body>
</html>
